<tr class="hover:bg-base-200/60">
    <td>
        <div class="flex items-center gap-3">
            <span class="flag-{{ .CountryCode }} shrink-0 rounded-[2px] shadow-sm" title="{{ .CountryCode }}"></span>
            <div class="min-w-0">
                <div class="font-mono text-sm">{{ .Address }}</div>
                <div class="whitespace-nowrap text-xs text-base-content/60 md:hidden">until {{ .BanEndsAt | time }}</div>
            </div>
        </div>
    </td>
    <td class="whitespace-nowrap tabular-nums">{{ .BannedAt | time }}</td>
    <td class="hidden md:table-cell"><span class="badge badge-sm badge-ghost tabular-nums">{{ .CurrentPenalty | formatPenalty }}</span></td>
    <td class="hidden whitespace-nowrap tabular-nums md:table-cell">{{ .BanEndsAt | time }}</td>
    {{ if .CanUnban }}
    <td class="text-right">
        <button type="button" class="btn btn-xs btn-ghost text-error" data-address="{{ .Address }}" onclick="openUnbanModal(this.dataset.address)">Unban</button>
    </td>
    {{ end }}
</tr>
