<div class="flex items-center justify-between gap-3">
    <div class="flex min-w-0 items-center gap-2">
        {{ if gt .CurrentlyBanned 0 }}
        <span class="status status-secondary animate-pulse" aria-hidden="true"></span>
        {{ else }}
        <span class="status status-success" aria-hidden="true"></span>
        {{ end }}
        <h2 class="truncate text-lg font-semibold">{{ .Name }}</h2>
    </div>
    <svg xmlns="http://www.w3.org/2000/svg" class="size-5 shrink-0 text-base-content/40 transition group-hover:translate-x-1 group-hover:text-primary" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
</div>
<div class="grid grid-cols-2 gap-3">
    <div class="rounded-field bg-base-200/70 px-3 py-2">
        <div class="text-xs text-base-content/60">Banned</div>
        <div class="text-xl font-semibold tabular-nums {{ if gt .CurrentlyBanned 0 }}text-secondary{{ end }}">{{ .CurrentlyBanned }}</div>
    </div>
    <div class="rounded-field bg-base-200/70 px-3 py-2">
        <div class="text-xs text-base-content/60">Failed</div>
        <div class="text-xl font-semibold tabular-nums">{{ .CurrentlyFailed }}</div>
    </div>
</div>
<div class="flex justify-between border-t border-base-300 pt-3 text-xs text-base-content/60">
    <span>Total banned <span class="font-semibold tabular-nums text-base-content">{{ .TotalBanned }}</span></span>
    <span>Total failed <span class="font-semibold tabular-nums text-base-content">{{ .TotalFailed }}</span></span>
</div>
