<!DOCTYPE html>
<html lang="en" data-theme="emerald">
{{ template "head" . }}
<body class="min-h-screen flex flex-col bg-base-200 text-base-content antialiased">
{{ template "header" . }}
<main class="flex grow items-center justify-center px-4 py-10">
    <div class="login w-full max-w-sm rounded-box border border-base-300 bg-base-100 p-8 text-center shadow-lg">
        <img class="mx-auto mb-4 h-24 w-auto" src="{{ .BasePath }}images/mascot.png" alt="fail2ban dashboard mascot" />
        <h1 class="text-xl font-bold tracking-tight">Welcome</h1>
        <p class="mt-1 mb-6 text-sm text-base-content/60">Sign in to view the fail2ban dashboard.</p>
        <form method="post" action="{{ .BasePath }}login">
            <button class="btn btn-primary btn-block" type="submit">Login via OAuth2</button>
        </form>
    </div>
</main>
</body>
</html>
