services:
  fail2ban:
    image: "crazymax/fail2ban:${FAIL2BAN_VERSION:-1.1.1}"
    environment:
      TZ: "Europe/Berlin"
      F2BD_ADDRESS: ":3000"
      F2BD_LOG_LEVEL: "debug"
      F2BD_SKIP_VERSION_CHECK: "true"
      F2BD_TRUST_PROXY_HEADERS: "true"
      F2BD_REFRESH_SECONDS: 15
      F2BD_METRICS_ADDRESS: ":9100"
      F2BD_METRICS: "true"
      F2BD_ALLOW_BAN_ALL: "true"
      F2BD_ALLOW_UNBAN_ALL: "true"
      F2BD_TRACK: "true"
    ports:
      - "3000:3000"
      - "9100:9100"
    volumes:
      - "../bin/linux/amd64:/app"
      - "./files/script:/script"
      - "./files/jail.d:/data/jail.d"
      - "./files/filter.d:/data/filter.d"
      - "./files/log:/var/log/test"
      - "/etc/localtime:/etc/localtime:ro"


